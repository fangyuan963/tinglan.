<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>听澜 · 情绪卡牌AI</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;600&family=Cinzel:wght@300;400&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
<link rel="stylesheet" href="ta0.css">
<!-- 百度统计 -->
<script>
window._hmt = window._hmt || [];
(function() {
  var hm = document.createElement("script");
  hm.src = "https://hm.baidu.com/hm.js?433c44765adfc653d1b007781119233e";
  hm.onload = function() {
    console.log('百度统计脚本加载成功');
  };
  hm.onerror = function() {
    console.log('百度统计脚本加载失败');
  };
  var s = document.getElementsByTagName("script")[0]; 
  s.parentNode.insertBefore(hm, s);
})();
</script>
</head>
<body>

<div class="ambient amb-1"></div>
<div class="ambient amb-2"></div>
<div class="ambient amb-3"></div>

<div class="container">

  <header>
    <div class="logo-mark">
      <div class="logo-line"></div>
      <div class="logo-sym">
        <svg viewBox="0 0 32 32" fill="none">
          <circle cx="16" cy="16" r="13" stroke="#d4a853" stroke-width="0.7" opacity="0.45"/>
          <circle cx="16" cy="16" r="7.5" stroke="#d4a853" stroke-width="0.5" opacity="0.3"/>
          <path d="M16 4L16 28M4 16L28 16" stroke="#d4a853" stroke-width="0.55" opacity="0.35"/>
          <path d="M8 8L24 24M24 8L8 24" stroke="#d4a853" stroke-width="0.35" opacity="0.2"/>
          <circle cx="16" cy="16" r="2.2" fill="#d4a853" opacity="0.55"/>
        </svg>
      </div>
      <div class="logo-line r"></div>
    </div>
    <h1>Lingua Animae</h1>
    <div class="tagline">听 澜 · 情绪卡牌AI</div>
  </header>

  <div class="question-section">
    <div class="step-label">请写下你的问题</div>
    <div class="question-wrapper">
      <textarea id="questionInput" placeholder="此刻，你想向内探寻什么？&#10;可以是一种困惑、一个决定，或是一段关系…" maxlength="100"></textarea>
      <div class="char-hint" id="charCount">0 / 100</div>
    </div>
  </div>

  <div class="spread-section">
    <div class="step-label">请先选择牌阵</div>
    <div class="spread-options">
      <button class="spread-btn" onclick="selectSpread('single',this)">
        <div class="spread-icon"><div class="mini-card"></div></div>
        <div class="spread-name">单张</div>
        <div class="spread-desc">当下的镜像<br>最核心的启示</div>
      </button>
      <button class="spread-btn" onclick="selectSpread('triple',this)">
        <div class="spread-icon">
          <div class="mini-card"></div>
          <div class="mini-card" style="opacity:.6;height:18px"></div>
          <div class="mini-card"></div>
        </div>
        <div class="spread-name">三张</div>
        <div class="spread-desc">过去·当下·未来<br>时间线的脉络</div>
      </button>
    </div>
  </div>

  <div class="shuffle-section">
    <button class="shuffle-btn" id="shuffleBtn" onclick="startShuffle()">
      <span id="shuffleBtnLabel">✦ 洗 牌 ✦</span>
    </button>
  </div>

  <!-- Spread Frames -->
  <div class="spread-frames" id="spreadFrames"></div>

  <!-- Shuffle Stage -->
  <div class="shuffle-stage-wrap" id="shuffleStageWrap">
    <div class="step-label" id="fanLabel">从牌中选择</div>
    <div class="shuffle-stage" id="shuffleStage">
      <div class="deck-pile" id="deckPile" style="display:none">
        <div class="deck-shadow"></div>
      </div>
      <div class="fan-container" id="fanContainer"></div>
    </div>
  </div>

  <!-- Drawn Area -->
  <div class="drawn-area">
    <div class="drawn-hint" id="drawnHint">双击卡牌，揭开牌面</div>
    <div class="drawn-cards-row" id="drawnCardsRow"></div>
  </div>

  <div class="divider"><div class="divider-line"></div><div class="divider-diamond"></div><div class="divider-line"></div></div>

  <div class="interpret-section">
    <button class="interpret-btn" id="interpretBtn" onclick="interpret()">解读</button>
  </div>

  <div class="loading-dots" id="loadingDots"><span></span><span></span><span></span></div>

  <div class="interpret-progress" id="interpretProgress">
    <div class="progress-card">
      <div class="card-back">
        <div class="card-pattern"></div>
      </div>
      <div class="card-front">
        <div class="card-icon">✦</div>
      </div>
    </div>
    <div class="progress-text" id="progressText">正在连接你...</div>
    <div class="progress-bar">
      <div class="progress-fill" id="progressFill"></div>
    </div>
  </div>

  <div class="feedback-modal" id="noQuestionModal" style="display:none;">
    <div class="modal-content">
      <div class="modal-title">提示</div>
      <div class="modal-message">输入问题后解读会更符合现状</div>
      <div class="modal-actions">
        <button class="modal-btn modal-btn-secondary" onclick="continueInterpret()">继续解读</button>
        <button class="modal-btn modal-btn-primary" onclick="goToQuestionInput()">去输入问题</button>
      </div>
    </div>
  </div>

  <div class="reading-section" id="readingSection">
    <div class="step-label">听 澜 解 读</div>
    <div class="reading-card">
      <div class="reading-ornament">· · ✦ · ·</div>
      <div class="reading-text" id="readingText"></div>
    </div>
    <div class="feedback-section">
      <div class="feedback-label">这次解读对你</div>
      <div class="feedback-btns">
        <button class="fb-btn" data-fb-type="accurate" onclick="feedback(this)">✓ 准</button>
        <button class="fb-btn" data-fb-type="interesting" onclick="feedback(this)">◈ 有点意思</button>
        <button class="fb-btn" data-fb-type="irrelevant" onclick="feedback(this)">○ 不相关</button>
      </div>
      <div class="feedback-message" id="feedbackMessage"></div>
      <div class="feedback-thanks" id="feedbackThanks">感谢你的反馈，每一份回应都在帮助你更了解自己。</div>
    </div>
  </div>

  <!-- Feedback Modal -->
  <div class="feedback-modal" id="feedbackModal">
    <div class="modal-content">
      <div class="modal-icon" id="modalIcon">✦</div>
      <div class="modal-title" id="modalTitle">标题</div>
      <div class="modal-message" id="modalMessage">消息内容</div>
      <button class="modal-close" onclick="closeModal()">关闭</button>
    </div>
  </div>

  <div class="slogan">万物有澜，听心归处。</div>
</div>

<script src="ta0.js"></script>
</body>
</html>
